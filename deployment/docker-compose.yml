services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  # Superuser for initialization only
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres  # Default database for superuser
      ACCOUNTS_POSTGRES_USER: ${ACCOUNTS_POSTGRES_USER}
      ACCOUNTS_POSTGRES_PASSWORD: ${ACCOUNTS_POSTGRES_PASSWORD}
      ACCOUNTS_POSTGRES_DB: ${ACCOUNTS_POSTGRES_DB}
      AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER}
      AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB}
      PETS_POSTGRES_USER: ${PETS_POSTGRES_USER}
      PETS_POSTGRES_PASSWORD: ${PETS_POSTGRES_PASSWORD}
      PETS_POSTGRES_DB: ${PETS_POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h ${POSTGRES_HOST} -p ${POSTGRES_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"

