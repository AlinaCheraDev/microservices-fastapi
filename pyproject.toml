[project]
name = "microservices-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.11"
dependencies = [
    "alembic==1.18.5",
    "bcrypt==5.0.0",
    "dependency-injector==4.49.1",
    "fastapi==0.139.0",
    "grpcio==1.81.1",
    "grpcio-tools==1.81.1",
    "loguru==0.7.3",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "redis==8.0.1",
    "slowapi==0.1.10",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 120        # per Technical_decisions.md
target-version = "py313"

[tool.ruff.lint]
# Enable a sensible rule set: pyflakes (F), pycodestyle (E/W),
# isort (I), bugbear (B), etc.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["src", "integration-tests"]